name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; only the package job gets write access.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      # GitHub-hosted runners already include Docker and Docker Compose.
      # compose.yaml requires its variables; the placeholders are fake.
      - name: Create .env from placeholders
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config -q

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      # Let every component report even if another one fails.
      fail-fast: false
      matrix:
        component: [frontend, python-api, node-api, java-api]
    # Both databases start for every matrix run (services cannot vary per
    # matrix entry); only the integration tests that need one connect to it.
    # Passwordless, throwaway containers: nothing here is a secret.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mysql:
        image: mysql:8.4.2
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tells test-component.sh to use the service containers above.
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Set up Node.js
        if: matrix.component == 'frontend' || matrix.component == 'node-api'
        uses: actions/setup-node@v4.0.4
        with:
          node-version: 22.9.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/node-api/package-lock.json

      - name: Set up Python
        if: matrix.component == 'python-api'
        uses: actions/setup-python@v5.2.0
        with:
          python-version: 3.12.5
          cache: pip
          cache-dependency-path: services/python-api/requirements*.txt

      - name: Set up Java
        if: matrix.component == 'java-api'
        uses: actions/setup-java@v4.4.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./scripts/ci/test-component.sh "${{ matrix.component }}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: test-reports-${{ matrix.component }}
          if-no-files-found: error
          path: |
            frontend/reports/*.xml
            services/python-api/reports/*.xml
            services/node-api/reports/*.xml
            services/java-api/target/surefire-reports/*.xml
            services/java-api/target/failsafe-reports/*.xml

  package:
    # Runs only if every test matrix entry passed.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, python-api, node-api, java-api]
    env:
      # Push on main and on manual runs; PRs and feature branches only build.
      PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Compute lowercase image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "name=ghcr.io/${owner}/${repo,,}/${{ matrix.component }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ matrix.component == 'frontend' && 'frontend' || format('services/{0}', matrix.component) }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # One file per component; the summary job collects them.
      - name: Record image reference
        run: |
          mkdir -p image-refs
          echo "${{ matrix.component }}|${{ steps.image.outputs.name }}|${PUSH_IMAGE}" > "image-refs/${{ matrix.component }}.txt"
      - uses: actions/upload-artifact@v4.4.0
        with:
          name: image-ref-${{ matrix.component }}
          path: image-refs/${{ matrix.component }}.txt

  summary:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          pattern: image-ref-*
          merge-multiple: true
          path: image-refs
      - name: Print image references
        run: |
          {
            echo "## Image references"
            echo
            echo "| Component | Image | Pushed |"
            echo "| --- | --- | --- |"
            for f in image-refs/*.txt; do
              IFS='|' read -r component image pushed < "$f"
              echo "| ${component} | \`${image}\` | ${pushed} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
